<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>JFIF → PNG 批次轉換</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #f5f5f5; }
    h1 { font-size: 20px; margin-bottom: 16px; }
    .upload-area {
      border: 2px dashed #aaa;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
      background: #fff;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .upload-area:hover { border-color: #e8622a; }
    input[type="file"] { display: none; }
    #status { font-size: 14px; color: #555; margin-bottom: 12px; min-height: 20px; }
    #btn-download-all {
      display: none;
      padding: 10px 24px;
      background: #e8622a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 20px;
    }
    #btn-download-all:hover { opacity: .85; }
    #preview-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .preview-item {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }
    .preview-item img { width: 100%; border-radius: 4px; }
    .preview-item span { font-size: 11px; color: #555; display: block; margin-top: 4px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>🖼️ JFIF → PNG 批次轉換</h1>

  <div class="upload-area" onclick="document.getElementById('file-input').click()">
    <p>點擊選取所有 .jfif 圖片</p>
    <p style="font-size:13px;color:#888;margin-top:8px;">可一次選取多個檔案</p>
    <input type="file" id="file-input" accept=".jfif,.jpg,.jpeg" multiple />
  </div>

  <div id="status"></div>
  <button id="btn-download-all">⬇️ 全部下載 PNG</button>
  <div id="preview-grid"></div>

  <canvas id="canvas" style="display:none"></canvas>

  <script>
    const input       = document.getElementById('file-input');
    const status      = document.getElementById('status');
    const btnAll      = document.getElementById('btn-download-all');
    const grid        = document.getElementById('preview-grid');
    const canvas      = document.getElementById('canvas');
    const ctx         = canvas.getContext('2d');

    let converted = []; // { name, blob }

    input.addEventListener('change', async () => {
      const files = Array.from(input.files);
      if (!files.length) return;

      converted = [];
      grid.innerHTML = '';
      btnAll.style.display = 'none';
      status.textContent = `正在轉換 0 / ${files.length}...`;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const pngName = file.name.replace(/\.[^.]+$/, '.png');
        const blob = await convertToPng(file);
        converted.push({ name: pngName, blob });

        // preview
        const url  = URL.createObjectURL(blob);
        const item = document.createElement('div');
        item.className = 'preview-item';
        item.innerHTML = `<img src="${url}" /><span>${pngName}</span>`;
        grid.appendChild(item);

        status.textContent = `正在轉換 ${i + 1} / ${files.length}...`;
      }

      status.textContent = `✅ 轉換完成！共 ${files.length} 張`;
      btnAll.style.display = 'inline-block';
    });

    function convertToPng(file) {
      return new Promise((resolve) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          canvas.width  = img.naturalWidth;
          canvas.height = img.naturalHeight;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(url);
          canvas.toBlob(resolve, 'image/png');
        };
        img.src = url;
      });
    }

    btnAll.addEventListener('click', async () => {
      for (const { name, blob } of converted) {
        const a   = document.createElement('a');
        a.href    = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        await new Promise(r => setTimeout(r, 150)); // 避免瀏覽器擋連續下載
      }
    });
  </script>
</body>
</html>
