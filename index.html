<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Pet</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- Top Nav -->
    <header class="top-bar">
      <div class="top-bar__tabs">
        <button class="tab active" data-tab="pet">寵物</button>
        <button class="tab" data-tab="bag">背包</button>
        <button class="tab" data-tab="food">食物</button>
        <button class="tab" data-tab="equip">裝備</button>
      </div>
      <div class="top-bar__coins">
        <span class="coin-icon">🪙</span>
        <span id="coin-count">0</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="content">

      <!-- Pet Tab -->
      <section class="tab-panel active" id="tab-pet">

        <!-- Info Card -->
        <div class="card pet-card">
          <div class="pet-card__left">
            <div class="pet-avatar">
              <img id="pet-svg" src="assets/pets/fox.png" alt="fox" class="pixel-art" />
            </div>
            <div id="pet-mood-emoji" class="mood-emoji">😊</div>
          </div>
          <div class="pet-card__right">
            <div class="pet-name-row">
              <span id="pet-name" class="pet-name">小狐</span>
              <span class="badge badge--r">R</span>
            </div>
            <div class="pet-level-row">
              <span class="label">Lv.</span>
              <span id="pet-level" class="level-num">1</span>
            </div>
            <div class="exp-bar-wrap">
              <div class="exp-bar">
                <div id="exp-fill" class="exp-bar__fill" style="width:0%"></div>
              </div>
              <span id="exp-text" class="exp-text">0 / 100</span>
            </div>
          </div>
        </div>

        <!-- Stats -->
        <div class="card stats-card">
          <div class="stat-row">
            <span class="stat-label">😄 心情</span>
            <div class="stat-bar-wrap">
              <div class="stat-bar"><div id="mood-fill" class="stat-bar__fill mood-fill" style="width:80%"></div></div>
              <span id="stat-mood" class="stat-value">80</span>
            </div>
          </div>
          <div class="stat-row">
            <span class="stat-label">🍖 飽食</span>
            <div class="stat-bar-wrap">
              <div class="stat-bar"><div id="hunger-fill" class="stat-bar__fill hunger-fill" style="width:60%"></div></div>
              <span id="stat-hunger" class="stat-value">60</span>
            </div>
          </div>
          <div class="stat-row">
            <span class="stat-label">💧 水份</span>
            <div class="stat-bar-wrap">
              <div class="stat-bar"><div id="water-fill" class="stat-bar__fill water-fill" style="width:70%"></div></div>
              <span id="stat-water" class="stat-value">70</span>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-grid">
          <button class="action-btn" id="btn-feed">
            <span class="action-icon">🍖</span>
            <span>餵食</span>
          </button>
          <button class="action-btn" id="btn-drink">
            <span class="action-icon">🥤</span>
            <span>飲料</span>
          </button>
          <button class="action-btn" id="btn-itembag">
            <span class="action-icon">🎒</span>
            <span>道具背包</span>
          </button>
          <button class="action-btn" id="btn-petbag">
            <span class="action-icon">🐾</span>
            <span>寵物背包</span>
          </button>
        </div>

      </section>

      <!-- Bag Tab -->
      <section class="tab-panel" id="tab-bag">
        <div class="card">
          <h3 class="section-title">🐾 寵物背包</h3>
          <div id="petbag-grid" class="item-grid">
            <div class="empty-hint">還沒有任何裝備</div>
          </div>
        </div>
      </section>

      <!-- Food Tab -->
      <section class="tab-panel" id="tab-food">
        <div class="card">
          <h3 class="section-title">食物</h3>
          <div class="item-grid">
            <div class="shop-item" data-item="fish">
              <span class="item-icon">🐟</span>
              <span class="item-name">小魚</span>
              <button class="buy-btn" data-cost="10" data-type="food" data-id="fish">10🪙</button>
            </div>
            <div class="shop-item" data-item="meat">
              <span class="item-icon">🍖</span>
              <span class="item-name">烤肉</span>
              <button class="buy-btn" data-cost="25" data-type="food" data-id="meat">25🪙</button>
            </div>
            <div class="shop-item" data-item="cake">
              <span class="item-icon">🎂</span>
              <span class="item-name">蛋糕</span>
              <button class="buy-btn" data-cost="50" data-type="food" data-id="cake">50🪙</button>
            </div>
          </div>
        </div>
        <div class="card">
          <h3 class="section-title">道具</h3>
          <div class="item-grid">
            <div class="shop-item">
              <span class="item-icon">🧪</span>
              <span class="item-name">回復藥</span>
              <button class="buy-btn" data-cost="40" data-type="item" data-id="potion">40🪙</button>
            </div>
            <div class="shop-item">
              <span class="item-icon">🍬</span>
              <span class="item-name">愛心糖</span>
              <button class="buy-btn" data-cost="25" data-type="item" data-id="candy">25🪙</button>
            </div>
            <div class="shop-item">
              <span class="item-icon">⭐</span>
              <span class="item-name">成長藥</span>
              <button class="buy-btn" data-cost="50" data-type="item" data-id="xpboost">50🪙</button>
            </div>
          </div>
        </div>
        <div class="card">
          <h3 class="section-title">飲料</h3>
          <div class="item-grid">
            <div class="shop-item" data-item="water">
              <span class="item-icon">💧</span>
              <span class="item-name">清水</span>
              <button class="buy-btn" data-cost="5" data-type="drink" data-id="water">5🪙</button>
            </div>
            <div class="shop-item" data-item="juice">
              <span class="item-icon">🧃</span>
              <span class="item-name">果汁</span>
              <button class="buy-btn" data-cost="15" data-type="drink" data-id="juice">15🪙</button>
            </div>
            <div class="shop-item" data-item="milk">
              <span class="item-icon">🥛</span>
              <span class="item-name">牛奶</span>
              <button class="buy-btn" data-cost="30" data-type="drink" data-id="milk">30🪙</button>
            </div>
          </div>
        </div>
      </section>

      <!-- Equip Tab -->
      <section class="tab-panel" id="tab-equip">
        <div class="card">
          <h3 class="section-title">裝備</h3>
          <div class="item-grid">
            <div class="shop-item">
              <span class="item-icon">🎩</span>
              <span class="item-name">紳士帽</span>
              <button class="buy-btn" data-cost="100" data-type="equip" data-id="hat">100🪙</button>
            </div>
            <div class="shop-item">
              <span class="item-icon">🧣</span>
              <span class="item-name">圍巾</span>
              <button class="buy-btn" data-cost="80" data-type="equip" data-id="scarf">80🪙</button>
            </div>
          </div>
        </div>
      </section>

    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-nav="home">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">首頁</span>
      </button>
      <button class="nav-btn" data-nav="explore">
        <span class="nav-icon">🗺️</span>
        <span class="nav-label">探索</span>
      </button>
      <button class="nav-btn" data-nav="shop">
        <span class="nav-icon">🛍️</span>
        <span class="nav-label">商店</span>
      </button>
      <button class="nav-btn" data-nav="settings">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">設定</span>
      </button>
    </nav>

  </div>

  <!-- Modals -->
  <div id="modal-drink" class="modal hidden">
    <div class="modal-box">
      <h2>選擇飲料</h2>
      <div class="drink-grid">
        <button class="drink-option" data-id="water">
          <span class="drink-icon">💧</span>
          <span class="drink-name">清水</span>
          <span class="drink-stat">+25 💧</span>
          <span class="drink-cost">5🪙</span>
        </button>
        <button class="drink-option" data-id="juice">
          <span class="drink-icon">🧃</span>
          <span class="drink-name">果汁</span>
          <span class="drink-stat">+40 💧 +3 😄</span>
          <span class="drink-cost">15🪙</span>
        </button>
        <button class="drink-option" data-id="milk">
          <span class="drink-icon">🥛</span>
          <span class="drink-name">牛奶</span>
          <span class="drink-stat">+60 💧 +5 😄</span>
          <span class="drink-cost">30🪙</span>
        </button>
      </div>
      <button class="modal-close" data-modal="modal-drink">✕</button>
    </div>
  </div>

  <div id="modal-itembag" class="modal hidden">
    <div class="modal-box">
      <h2>🎒 道具背包</h2>
      <div id="itembag-list" class="itembag-list"></div>
      <p class="modal-hint">到食物頁面購買道具</p>
      <button class="modal-close" data-modal="modal-itembag">✕</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="game.js"></script>
</body>
</html>
